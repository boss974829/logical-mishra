const talks = pack.talks, parts = pack.parts;
const key = "mishra-lived";
let lived = [];
try { lived = JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { lived = []; }
if (!Array.isArray(lived)) lived = [];
let tab = "today";
let activeId = talks[0].id;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({"&":"&","<":"<",">":">"}[c]));
const done = (t) => lived.includes(t.id);
function current(){ return talks.find((t) => !done(t)) || talks[talks.length - 1]; }
function save(){ localStorage.setItem(key, JSON.stringify(lived)); }
function openTalk(id){ activeId = id; tab = "step"; render(); }
function render(){
  const finished = talks.filter(done).length;
  document.getElementById("meter").style.width = (finished / talks.length * 100) + "%";
  document.getElementById("meta").textContent = finished + " of 100 talks lived · Rational Mishra";
  document.getElementById("tab-today").className = tab === "today" ? "on" : "";
  document.getElementById("tab-plan").className = tab === "plan" ? "on" : "";
  document.getElementById("tab-step").className = tab === "step" ? "on" : "";
  const main = document.getElementById("main");
  if (tab === "today") {
    const talk = current();
    const part = parts.find((p) => p.id === talk.part);
    main.innerHTML = '<p class="kicker">' + esc(part.rank) + " · " + esc(part.name) + '</p><h2>' + esc(talk.title) + '</h2><p class="muted">' + esc(part.aim) + '</p><div class="note"><p class="kicker">Note</p><p>' + esc(talk.notes[0]) + '</p></div><div class="practice"><p class="kicker">Do this</p><p>' + esc(talk.practice) + '</p></div><button class="primary" id="go" type="button">Open the notes</button>';
    document.getElementById("go").onclick = () => openTalk(talk.id);
    return;
  }
  if (tab === "plan") {
    main.innerHTML = parts.map((part) => {
      const group = talks.filter((t) => t.part === part.id);
      const n = group.filter(done).length;
      return '<section class="part"><p class="kicker" style="color:var(--muted)">' + esc(part.rank) + " · " + esc(part.name) + ' <span style="color:var(--ember)">' + n + '/20</span></p><p class="muted">' + esc(part.aim) + '</p>' +
        group.map((talk) => '<button class="row" type="button" data-id="' + talk.id + '"><span class="n ' + (done(talk) ? "on" : "") + '">' + (done(talk) ? "✓" : String(talk.n).padStart(2,"0")) + '</span><span><b style="font-weight:500">' + esc(talk.title) + '</b><br><span class="small">' + esc(talk.minutes) + '</span></span></button>').join("") +
      '</section>';
    }).join("");
    main.querySelectorAll("[data-id]").forEach((btn) => { btn.onclick = () => openTalk(btn.dataset.id); });
    return;
  }
  const talk = talks.find((t) => t.id === activeId) || talks[0];
  const part = parts.find((p) => p.id === talk.part);
  const group = talks.filter((t) => t.part === part.id);
  const livedThis = done(talk);
  main.innerHTML = '<p class="kicker">' + esc(part.rank) + " · " + esc(part.name) + " · " + esc(talk.minutes) + '</p><h2>' + esc(talk.title) + '</h2><p class="muted">' + esc(part.aim) + '</p>' +
    '<div class="note"><p class="kicker">Notes</p><ol>' + talk.notes.map((n) => '<li>' + esc(n) + '</li>').join("") + '</ol></div>' +
    '<div class="practice"><p class="kicker">Implementation</p><p>' + esc(talk.practice) + '</p></div>' +
    '<button class="primary" id="did" type="button" ' + (livedThis ? "disabled" : "") + '>' + (livedThis ? "Lived" : "I did the practice") + '</button>' +
    '<iframe src="https://www.youtube-nocookie.com/embed/' + talk.youtubeId + '" title="' + esc(talk.talk) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>' +
    '<p class="small">Talk ' + String(talk.n).padStart(2,"0") + ' of 20 in this part. ' + esc(talk.talk) + '</p>' +
    '<div style="margin-top:1rem">' + group.map((item) => '<button class="row" type="button" data-id="' + item.id + '"><span class="n ' + (item.id===talk.id || done(item) ? "on" : "") + '">' + String(item.n).padStart(2,"0") + '</span><span>' + esc(item.title) + '</span></button>').join("") + '</div>';
  main.querySelectorAll("[data-id]").forEach((btn) => { btn.onclick = () => openTalk(btn.dataset.id); });
  const did = document.getElementById("did");
  if (did && !livedThis) did.onclick = () => {
    lived.push(talk.id); save();
    const next = talks[talks.findIndex((t) => t.id === talk.id) + 1];
    if (next) activeId = next.id;
    render();
  };
}
document.getElementById("tab-today").onclick = () => { tab = "today"; render(); };
document.getElementById("tab-plan").onclick = () => { tab = "plan"; render(); };
document.getElementById("tab-step").onclick = () => { tab = "step"; render(); };
render();
</script>
